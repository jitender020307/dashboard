<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure DMS - Digital Evidence &amp; Investigation Vault</title>
    <meta name="description" content="Secure digital document management system for legal and investigation documents with chain-of-custody tracking, integrity verification, and access controls." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <script>
      // Intercept benign ResizeObserver notifications that trigger cross-origin "Script error." in iframe preview
      window.addEventListener('error', function (event) {
        if (
          event.message === 'ResizeObserver loop completed with undelivered notifications' ||
          event.message === 'ResizeObserver loop limit exceeded' ||
          (typeof event.message === 'string' && event.message.indexOf('ResizeObserver') !== -1)
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return false;
        }
      });
    </script>
  </head>
  <body class="antialiased bg-[#f4f6fa] text-[#0f172a] selection:bg-[#0284c7]/20 selection:text-[#0369a1]">
    <div id="root"></div>
    <script type="module" crossorigin src="/src/main.tsx"></script>
  </body>
</html>
